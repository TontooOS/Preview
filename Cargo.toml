[package]
name = "preview"
version = "26.1.0"
edition = "2021"
description = "Preview for TontooOS"
readme = "README.md"

[[bin]]
name = "preview"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "UIKit", "Foundation", "Accessibility"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
gdk-pixbuf = "0.20"
image = "0.25"
lopdf = "0.45"
flate2 = "1.1"
quick-xml = "0.37"
